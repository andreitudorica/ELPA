openapi: 3.0.0
paths:
  /api/me:
    get:
      operationId: AccessController_getCurrentAdministrator
      parameters: []
      responses:
        '200':
          description: The resolved ELPA Administrator for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Administrator_Output'
      tags:
        - identity
  /api/admin/research-campaigns:
    get:
      operationId: ResearchCampaignController_list
      parameters: []
      responses:
        '200':
          description: Research Campaigns ordered from newest to oldest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchCampaignList_Output'
      tags:
        - studio-research
    post:
      operationId: ResearchCampaignController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResearchCampaign'
      responses:
        '201':
          description: The newly opened Research Campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchCampaign_Output'
      tags:
        - studio-research
  /api/admin/research-campaigns/{campaignId}/acquisition-runs:
    get:
      operationId: AcquisitionController_listRuns
      parameters:
        - name: campaignId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        '200':
          description: Acquisition Runs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionRunList_Output'
      tags:
        - studio-research
  /api/admin/research-campaigns/{campaignId}/acquisition-report:
    get:
      operationId: AcquisitionController_report
      parameters:
        - name: campaignId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        '200':
          description: Data-quality, cross-source, and coverage report computed from
            stored records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionReport_Output'
      tags:
        - studio-research
  /api/admin/research-campaigns/{campaignId}/candidates:
    get:
      operationId: AcquisitionController_listCandidates
      parameters:
        - name: campaignId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: source
          required: false
          in: query
          schema:
            type: string
            enum:
              - situr_accommodation_register
              - osm_geofabrik_romania
              - overture_places
        - name: screening
          required: false
          in: query
          schema:
            type: string
            enum:
              - plausible
              - ambiguous
              - out_of_scope
              - insufficient_data
        - name: county
          required: false
          in: query
          schema:
            pattern: ^RO-[A-Z]{1,2}$
            type: string
        - name: search
          required: false
          in: query
          schema:
            minLength: 1
            maxLength: 100
            type: string
        - name: match
          required: false
          in: query
          schema:
            type: string
            enum:
              - with_suggestions
              - without_suggestions
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100000
            default: 1
            type: integer
        - name: pageSize
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 25
            type: integer
      responses:
        '200':
          description: Unverified Candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatePage_Output'
      tags:
        - studio-research
  /api/admin/research-campaigns/{campaignId}/candidates/{candidateId}:
    get:
      operationId: AcquisitionController_getCandidate
      parameters:
        - name: campaignId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: candidateId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        '200':
          description: A Candidate with its Claims, Evidence, run history, and duplicate
            suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail_Output'
      tags:
        - studio-research
  /api/admin/research-campaigns/{campaignId}/duplicate-suggestions:
    get:
      operationId: AcquisitionController_listSuggestions
      parameters:
        - name: campaignId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: relation
          required: false
          in: query
          schema:
            type: string
            enum:
              - same_property
              - same_provider
        - name: strength
          required: false
          in: query
          schema:
            type: string
            enum:
              - likely
              - possible
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100000
            default: 1
            type: integer
        - name: pageSize
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 25
            type: integer
      responses:
        '200':
          description: Explainable duplicate suggestions from the current matcher version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateSuggestionPage_Output'
      tags:
        - studio-research
  /api/healthz:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus_Output'
      tags:
        - Health
  /api/readyz:
    get:
      operationId: ReadinessController_check
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus_Output'
      tags:
        - Readiness
info:
  title: ELPA API
  description: REST contract shared by the Recommendation Product and ELPA Data Studio.
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    Administrator_Output:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        displayName:
          type: string
          minLength: 1
      required:
        - id
        - email
        - displayName
      additionalProperties: false
    ResearchCampaign_Output:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
        eventNeed:
          type: string
        category:
          type: string
          enum:
            - group_rental_property
        countryCode:
          type: string
          enum:
            - RO
        county:
          type: string
          nullable: true
        locality:
          type: string
          nullable: true
        minimumCriteria:
          type: array
          items:
            type: string
        investigatedSources:
          type: array
          items:
            type: string
            format: uri
        createdBy:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            displayName:
              type: string
          required:
            - id
            - email
            - displayName
          additionalProperties: false
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - name
        - eventNeed
        - category
        - countryCode
        - county
        - locality
        - minimumCriteria
        - investigatedSources
        - createdBy
        - createdAt
        - updatedAt
      additionalProperties: false
    ResearchCampaignList_Output:
      type: array
      items:
        $ref: '#/components/schemas/ResearchCampaign_Output'
    CreateResearchCampaign:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 160
        eventNeed:
          type: string
          minLength: 1
          maxLength: 500
        county:
          type: string
          maxLength: 100
        locality:
          type: string
          maxLength: 200
        minimumCriteria:
          minItems: 1
          maxItems: 20
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
        investigatedSources:
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: string
            format: uri
      required:
        - name
        - eventNeed
        - minimumCriteria
        - investigatedSources
    AcquisitionRun_Output:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        sourceKey:
          type: string
          enum:
            - situr_accommodation_register
            - osm_geofabrik_romania
            - overture_places
        stage:
          type: string
          enum:
            - import
            - extract
        status:
          type: string
          enum:
            - running
            - succeeded
            - completed_with_rejections
            - failed
        parserVersion:
          type: string
        normalizerVersion:
          type: string
        startedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        completedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          nullable: true
        outputDigest:
          type: string
          nullable: true
        failure:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
          nullable: true
        stats:
          type: object
          additionalProperties: {}
        artifact:
          type: object
          properties:
            sha256:
              type: string
            datasetVersion:
              type: string
              nullable: true
            originalUrl:
              type: string
            fileName:
              type: string
            byteSize:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            retrievedAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            reuseTerms:
              type: string
            retentionPolicy:
              type: string
          required:
            - sha256
            - datasetVersion
            - originalUrl
            - fileName
            - byteSize
            - retrievedAt
            - reuseTerms
            - retentionPolicy
          additionalProperties: false
      required:
        - id
        - sourceKey
        - stage
        - status
        - parserVersion
        - normalizerVersion
        - startedAt
        - completedAt
        - outputDigest
        - failure
        - stats
        - artifact
      additionalProperties: false
    AcquisitionRunList_Output:
      type: array
      items:
        $ref: '#/components/schemas/AcquisitionRun_Output'
    AcquisitionReport_Output:
      type: object
      properties:
        reportVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        campaign:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            name:
              type: string
            county:
              type: string
              nullable: true
            locality:
              type: string
              nullable: true
          required:
            - id
            - name
            - county
            - locality
          additionalProperties: false
        labelling:
          type: object
          properties:
            observed:
              type: string
            estimate:
              type: string
            notVerified:
              type: string
          required:
            - observed
            - estimate
            - notVerified
          additionalProperties: false
        sources:
          type: array
          items:
            type: object
            properties:
              sourceKey:
                type: string
                enum:
                  - situr_accommodation_register
                  - osm_geofabrik_romania
                  - overture_places
              label:
                type: string
              reuseTerms:
                type: string
              retentionPolicy:
                type: string
              attribution:
                type: string
              artifacts:
                type: array
                items:
                  type: object
                  properties:
                    sha256:
                      type: string
                    datasetVersion:
                      type: string
                      nullable: true
                    retrievedAt:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    byteSize:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    originalUrl:
                      type: string
                  required:
                    - sha256
                    - datasetVersion
                    - retrievedAt
                    - byteSize
                    - originalUrl
                  additionalProperties: false
              latestRun:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  status:
                    type: string
                  startedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  parserVersion:
                    type: string
                  normalizerVersion:
                    type: string
                  outputDigest:
                    type: string
                    nullable: true
                required:
                  - id
                  - status
                  - startedAt
                  - parserVersion
                  - normalizerVersion
                  - outputDigest
                additionalProperties: false
                nullable: true
              runsByStatus:
                type: object
                additionalProperties:
                  type: number
              distinctOutputDigests:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              records:
                type: object
                properties:
                  read:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  parsed:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  rejected:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  rejectionsByCode:
                    type: object
                    additionalProperties:
                      type: number
                  excludedBySource:
                    type: object
                    additionalProperties:
                      type: number
                required:
                  - read
                  - parsed
                  - rejected
                  - rejectionsByCode
                  - excludedBySource
                additionalProperties: false
              candidates:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              screening:
                type: object
                additionalProperties:
                  type: number
              missingIdentifiers:
                type: object
                properties:
                  count:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  definition:
                    type: string
                required:
                  - count
                  - definition
                additionalProperties: false
              derivedKeyCollisions:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              missingLocation:
                type: object
                properties:
                  withoutCounty:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  withoutSettlement:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  withoutCoordinates:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - withoutCounty
                  - withoutSettlement
                  - withoutCoordinates
                additionalProperties: false
              fieldCompleteness:
                type: array
                items:
                  type: object
                  properties:
                    target:
                      type: string
                    candidates:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    share:
                      type: number
                  required:
                    - target
                    - candidates
                    - share
                  additionalProperties: false
            required:
              - sourceKey
              - label
              - reuseTerms
              - retentionPolicy
              - attribution
              - artifacts
              - latestRun
              - runsByStatus
              - distinctOutputDigests
              - records
              - candidates
              - screening
              - missingIdentifiers
              - derivedKeyCollisions
              - missingLocation
              - fieldCompleteness
            additionalProperties: false
        crossSource:
          type: object
          properties:
            matcherVersion:
              type: string
            suggestions:
              type: array
              items:
                type: object
                properties:
                  relation:
                    type: string
                  strength:
                    type: string
                  rule:
                    type: string
                  sources:
                    type: string
                  count:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - relation
                  - strength
                  - rule
                  - sources
                  - count
                additionalProperties: false
            registerWithOsmCounterpart:
              type: object
              properties:
                likely:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                likelyOrPossible:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                total:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
                - likely
                - likelyOrPossible
                - total
              additionalProperties: false
            osmWithRegisterCounterpart:
              type: object
