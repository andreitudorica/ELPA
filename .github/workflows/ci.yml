name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  validate:
    name: Validate (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v5

      - name: Set up Node (version from .nvmrc, pinned to Node 24 LTS)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      # Generation creates the Nest application without querying PostgreSQL.
      # Use sanitized example configuration rather than CI secrets.
      - name: API contract and generated client drift check
        run: |
          cp apps/api/.env.example apps/api/.env.local
          pnpm openapi:generate
          git diff --exit-code -- apps/api/openapi.yaml apps/web/src/lib/apiClient/generated/schema.d.ts || {
            echo "::error::Generated API contract or client is out of date. Run 'pnpm openapi:generate' and commit."
            exit 1
          }

  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v5

      - name: Set up Node (version from .nvmrc, pinned to Node 24 LTS)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full browser matrix runs on the nightly workflow.
      - name: Install Playwright browsers (chromium only)
        run: pnpm --filter @elpa/web exec playwright install --with-deps chromium
        if: hashFiles('apps/web/playwright.config.ts') != ''

      - name: Run end-to-end tests
        run: pnpm turbo run test:e2e -- --project=chromium
        if: hashFiles('apps/web/playwright.config.ts') != ''

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
